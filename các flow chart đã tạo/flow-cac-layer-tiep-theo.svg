<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222" />
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #222; }
      .body { font: 15px Arial, sans-serif; fill: #111; }
      .small { font: 13px Arial, sans-serif; fill: #222; }
      .tiny { font: 12px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.4; rx: 0; }
      .layer { fill: #f8fafc; stroke: #444; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .data { fill: #fff7ed; stroke: #9a3412; stroke-width: 1.4; }
      .cmd { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.4; }
      .ok { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.4; }
      .warn { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.4; }
      .line { stroke: #222; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #555; stroke-width: 1.3; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .label { font: 18px Arial, sans-serif; fill: #111; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1100" fill="#ffffff" />
  <text x="900" y="48" text-anchor="middle" class="title">Flow các layer tiếp theo cho hệ thống tưới cây tự động</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Tiếp nối Layer 1 Sensing, Layer 2 Edge Processing &amp; Control, Layer 3 Actuator</text>

  <rect x="60" y="125" width="365" height="850" class="layer" />
  <text x="242" y="165" text-anchor="middle" class="title">Layer 3</text>
  <text x="242" y="195" text-anchor="middle" class="subtitle">Actuator &amp; Local Feedback</text>

  <rect x="90" y="235" width="305" height="132" class="box" />
  <text x="242" y="260" text-anchor="middle" class="subtitle">1. Nhận lệnh điều khiển</text>
  <text x="110" y="292" class="body">Đối tượng: Relay + bơm nước</text>
  <text x="110" y="316" class="body">Input: pump_cmd, duration</text>
  <text x="110" y="340" class="body">Nguồn: ControlData_t từ Layer 2</text>

  <rect x="90" y="420" width="305" height="150" class="box" />
  <text x="242" y="445" text-anchor="middle" class="subtitle">2. Kích hoạt bơm</text>
  <text x="110" y="477" class="body">Nếu pump_cmd = ON:</text>
  <text x="130" y="501" class="body">- bật relay</text>
  <text x="130" y="525" class="body">- chạy bơm theo duration</text>
  <text x="110" y="549" class="body">Nếu pump_cmd = OFF: tắt relay</text>

  <rect x="90" y="625" width="305" height="156" class="ok" />
  <text x="242" y="650" text-anchor="middle" class="subtitle">3. Phản hồi trạng thái</text>
  <text x="110" y="682" class="body">Output: pump_state</text>
  <text x="110" y="706" class="body">Output: watering_time</text>
  <text x="110" y="730" class="body">Output: actuator_error</text>
  <text x="110" y="754" class="body">Gửi ngược về Layer 2 để đóng gói log</text>

  <rect x="505" y="125" width="365" height="850" class="layer" />
  <text x="687" y="165" text-anchor="middle" class="title">Layer 4</text>
  <text x="687" y="195" text-anchor="middle" class="subtitle">Communication &amp; Cloud Gateway</text>

  <rect x="535" y="235" width="305" height="142" class="box" />
  <text x="687" y="260" text-anchor="middle" class="subtitle">1. Chuẩn bị gói upload</text>
  <text x="555" y="292" class="body">Đối tượng: Task_Cloud</text>
  <text x="555" y="316" class="body">Input: SensorData_t, ControlData_t</text>
  <text x="555" y="340" class="body">Tạo: TelemetryPacket_t</text>
  <text x="555" y="364" class="body">Chuẩn hóa timestamp, device_id</text>

  <rect x="535" y="425" width="305" height="166" class="box" />
  <text x="687" y="450" text-anchor="middle" class="subtitle">2. Kết nối mạng</text>
  <text x="555" y="482" class="body">Đối tượng: ESP32 WiFi</text>
  <text x="555" y="506" class="body">Kiểm tra: WiFi_status</text>
  <text x="555" y="530" class="body">Nếu mất mạng: lưu buffer cục bộ</text>
  <text x="555" y="554" class="body">Nếu có mạng: gửi MQTT/HTTP</text>
  <text x="555" y="578" class="body">Biến: cloud_status, retry_count</text>

  <rect x="535" y="640" width="305" height="168" class="cmd" />
  <text x="687" y="665" text-anchor="middle" class="subtitle">3. Nhận cấu hình từ cloud</text>
  <text x="555" y="697" class="body">Input: remote_config</text>
  <text x="555" y="721" class="body">Gồm: H_threshold, schedule</text>
  <text x="555" y="745" class="body">Gồm: auto_mode, manual_cmd</text>
  <text x="555" y="769" class="body">Output: ConfigData_t về Layer 2</text>
  <text x="555" y="793" class="body">Ưu tiên kiểm tra checksum/version</text>

  <rect x="950" y="125" width="365" height="850" class="layer" />
  <text x="1132" y="165" text-anchor="middle" class="title">Layer 5</text>
  <text x="1132" y="195" text-anchor="middle" class="subtitle">Cloud Storage &amp; Application Service</text>

  <rect x="980" y="235" width="305" height="154" class="data" />
  <text x="1132" y="260" text-anchor="middle" class="subtitle">1. Lưu dữ liệu cảm biến</text>
  <text x="1000" y="292" class="body">Bảng: telemetry_log</text>
  <text x="1000" y="316" class="body">Trường: T_air, H_air, H_soil</text>
  <text x="1000" y="340" class="body">Trường: pump_state, error_flag</text>
  <text x="1000" y="364" class="body">Khóa: device_id, timestamp</text>

  <rect x="980" y="438" width="305" height="156" class="box" />
  <text x="1132" y="463" text-anchor="middle" class="subtitle">2. Xử lý nghiệp vụ cloud</text>
  <text x="1000" y="495" class="body">Tính: độ ẩm trung bình ngày</text>
  <text x="1000" y="519" class="body">Tính: tổng thời gian tưới</text>
  <text x="1000" y="543" class="body">Phát hiện: sensor lỗi, bơm lỗi</text>
  <text x="1000" y="567" class="body">Sinh: alert_event nếu vượt ngưỡng</text>

  <rect x="980" y="646" width="305" height="172" class="cmd" />
  <text x="1132" y="671" text-anchor="middle" class="subtitle">3. Quản lý cấu hình</text>
  <text x="1000" y="703" class="body">Bảng: device_config</text>
  <text x="1000" y="727" class="body">Lưu: H_threshold, T_threshold</text>
  <text x="1000" y="751" class="body">Lưu: watering_schedule</text>
  <text x="1000" y="775" class="body">Lưu: auto/manual mode</text>
  <text x="1000" y="799" class="body">Output: remote_config</text>

  <rect x="1365" y="125" width="365" height="850" class="layer" />
  <text x="1547" y="165" text-anchor="middle" class="title">Layer 6</text>
  <text x="1547" y="195" text-anchor="middle" class="subtitle">Dashboard, User &amp; Notification</text>

  <rect x="1395" y="235" width="305" height="148" class="box" />
  <text x="1547" y="260" text-anchor="middle" class="subtitle">1. Hiển thị trạng thái</text>
  <text x="1415" y="292" class="body">Màn hình: Web/App dashboard</text>
  <text x="1415" y="316" class="body">Hiển thị: nhiệt độ, độ ẩm</text>
  <text x="1415" y="340" class="body">Hiển thị: trạng thái bơm</text>
  <text x="1415" y="364" class="body">Biểu đồ: lịch sử tưới</text>

  <rect x="1395" y="435" width="305" height="160" class="cmd" />
  <text x="1547" y="460" text-anchor="middle" class="subtitle">2. Người dùng cấu hình</text>
  <text x="1415" y="492" class="body">Nhập: ngưỡng độ ẩm đất</text>
  <text x="1415" y="516" class="body">Nhập: lịch tưới</text>
  <text x="1415" y="540" class="body">Chọn: tự động/thủ công</text>
  <text x="1415" y="564" class="body">Lệnh tay: bật/tắt bơm</text>

  <rect x="1395" y="650" width="305" height="158" class="warn" />
  <text x="1547" y="675" text-anchor="middle" class="subtitle">3. Cảnh báo</text>
  <text x="1415" y="707" class="body">Điều kiện: đất quá khô</text>
  <text x="1415" y="731" class="body">Điều kiện: cảm biến lỗi</text>
  <text x="1415" y="755" class="body">Điều kiện: bơm chạy quá lâu</text>
  <text x="1415" y="779" class="body">Kênh: app/email/notification</text>

  <rect x="550" y="900" width="760" height="80" class="data" />
  <text x="930" y="930" text-anchor="middle" class="subtitle">TelemetryPacket_t</text>
  <text x="930" y="958" text-anchor="middle" class="body">device_id, timestamp, SensorData_t, ControlData_t, pump_state, cloud_status, error_flag</text>

  <path d="M395 490 H535" class="line" />
  <text x="465" y="468" text-anchor="middle" class="label">pump_state</text>

  <path d="M840 305 H980" class="line" />
  <text x="910" y="282" text-anchor="middle" class="label">upload telemetry</text>

  <path d="M1285 312 H1395" class="line" />
  <text x="1340" y="290" text-anchor="middle" class="label">realtime data</text>

  <path d="M1547 595 V875 H1132 V818" class="dash" />
  <text x="1355" y="858" text-anchor="middle" class="label">user_config</text>

  <path d="M980 735 H840" class="dash" />
  <text x="910" y="715" text-anchor="middle" class="label">remote_config</text>

  <path d="M535 724 H460 V260 H395" class="dash" />
  <text x="475" y="240" class="label">ConfigData_t về Layer 2</text>

  <path d="M687 808 V900" class="line" />
  <path d="M1132 389 V438" class="line" />
  <path d="M1132 594 V646" class="line" />
  <path d="M1547 383 V435" class="line" />
  <path d="M1547 595 V650" class="line" />
  <path d="M242 367 V420" class="line" />
  <path d="M242 570 V625" class="line" />

  <rect x="70" y="1010" width="1660" height="58" fill="#fff" stroke="#444" stroke-width="1" />
  <text x="90" y="1035" class="small">Ghi chú: Layer 4 đảm nhiệm truyền thông; Layer 5 lưu trữ và xử lý dữ liệu cloud; Layer 6 là giao diện người dùng và cảnh báo.</text>
  <text x="90" y="1058" class="small">Luồng phản hồi: người dùng đổi cấu hình trên Dashboard -&gt; Cloud lưu remote_config -&gt; ESP32 nhận ConfigData_t -&gt; Layer 2 cập nhật ngưỡng/lịch tưới.</text>
</svg>
